[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ridesharing"
version = "1.0.0"
description = "A strategy-driven ridesharing system with driver matching, pricing, and payments"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["models*", "services*", "strategies*", "enums*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
